[package]
name = "bspx"
version = "0.2.0"
edition = "2024"
description = "A BSP tiling window manager for macOS with smooth animations."
license = "MIT"

[dependencies]
log = "0.4"
env_logger = "0.11"
regex = "1"

[lints.rust]
# `--cfg bspx_check_macos` type-checks the macOS backend on other hosts.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bspx_check_macos)'] }

[profile.release]
lto = true
codegen-units = 1
